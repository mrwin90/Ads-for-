<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskRain BD - Live Payouts</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        /* আগের সব স্টাইল এখানে থাকবে... */
        :root { --primary: #1c2a35; --card: #243447; --accent: #ffd700; --blue: #0088cc; --success: #27ae60; --warning: #f39c12; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: var(--primary); color: white; margin: 0; padding: 15px; text-align: center; padding-bottom: 80px; }
        .card { background: var(--card); border-radius: 15px; padding: 20px; margin-bottom: 15px; border: 1px solid #34495e; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        .balance { font-size: 32px; color: var(--accent); font-weight: bold; margin: 10px 0; }
        .btn { background: var(--blue); border: none; color: white; padding: 14px; border-radius: 12px; cursor: pointer; font-weight: bold; width: 100%; font-size: 16px; transition: 0.3s; margin-top: 5px; }

        /* --- ফেক লাইভ পেমেন্ট স্টাইল --- */
        #fake-payout {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(150%);
            background: rgba(39, 174, 96, 0.95);
            color: white;
            padding: 10px 20px;
            border-radius: 50px;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            z-index: 10000;
            transition: transform 0.5s ease-in-out;
            white-space: nowrap;
            border: 1px solid #fff;
        }
        .payout-icon { background: white; color: #27ae60; border-radius: 50%; width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; font-weight: bold; }
        /* --------------------------- */

        /* বাকি ডিজাইনগুলো আগের মতোই থাকবে... */
        #withdraw-status { display: none; margin-top: 15px; }
        .status-card { background: rgba(243, 156, 18, 0.15); border: 1px dashed var(--warning); padding: 15px; border-radius: 12px; text-align: left; }
        .leader-item { display: flex; justify-content: space-between; padding: 10px; border-bottom: 1px solid #34495e; font-size: 14px; }
        input[type="number"], select { width: 100%; padding: 12px; margin: 10px 0; border-radius: 10px; border: 1px solid #34495e; background: #1c2a35; color: white; box-sizing: border-box; }
    </style>
</head>
<body>

    <div id="fake-payout">
        <div class="payout-icon">✓</div>
        <div id="payout-text">Sujon Just Withdrew ৳1500 via Bkash</div>
    </div>

    <div class="card">
        <h2 style="margin:0;">TaskRain BD</h2>
        <p id="user-info" style="font-size: 11px; color: #888;">Loading...</p>
        <div class="balance">৳ <span id="balance">0.00</span></div>
    </div>

    <div id="withdraw-status" class="card">
        <div class="status-card">
            <div style="font-size: 14px; font-weight: bold; color: var(--warning);">⏳ পেমেন্ট প্রসেসিং হচ্ছে...</div>
            <div id="pending-info" style="font-size: 11px; color: var(--accent); margin-top: 8px;"></div>
        </div>
    </div>

    <div class="card">
        <h3>📹 বিজ্ঞাপন দেখে আয়</h3>
        <button class="btn" onclick="startAdProcess()">বিজ্ঞাপন দেখুন</button>
    </div>

    <div class="card">
        <h3>💸 টাকা উত্তোলন</h3>
        <select id="method">
            <option value="Bkash">বিকাশ (Bkash)</option>
            <option value="Nagad">নগদ (Nagad)</option>
        </select>
        <input type="number" id="phone" placeholder="আপনার নম্বর দিন">
        <button class="btn" style="background: var(--success);" onclick="sendWithdraw()">উত্তোলন রিকোয়েস্ট</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        
        // --- ফেক লাইভ পেমেন্ট লজিক ---
        const names = ["Abir", "Mitu", "Sabbir", "Sumaiya", "Rakib", "Nitu", "Jashim", "Emon", "Fahim", "Mim"];
        const amounts = [1500, 2000, 1800, 2500, 1500, 3000];
        const methods = ["Bkash", "Nagad", "Rocket"];

        function showFakePayout() {
            const name = names[Math.floor(Math.random() * names.length)];
            const amount = amounts[Math.floor(Math.random() * amounts.length)];
            const method = methods[Math.floor(Math.random() * methods.length)];
            
            document.getElementById('payout-text').innerText = `${name} Just Withdrew ৳${amount} via ${method}`;
            
            const el = document.getElementById('fake-payout');
            el.style.transform = 'translateX(-50%) translateY(0)'; // নিচে থেকে উপরে উঠবে
            
            setTimeout(() => {
                el.style.transform = 'translateX(-50%) translateY(150%)'; // আবার নিচে চলে যাবে
            }, 4000);
        }

        // প্রতি ১০-১৫ সেকেন্ড পর পর দেখাবে
        setInterval(showFakePayout, 12000);
        // ---------------------------

        let bal = parseFloat(localStorage.getItem('tr_bal')) || 0;
        let isPending = localStorage.getItem('tr_pending') === 'true';

        function updateUI() {
            document.getElementById('balance').innerText = bal.toFixed(2);
            if(isPending) {
                document.getElementById('withdraw-status').style.display = 'block';
                document.getElementById('pending-info').innerText = `পেন্ডিং: ${localStorage.getItem('tr_pending_amt')} BDT (${localStorage.getItem('tr_pending_method')})`;
            }
        }

        function startAdProcess() {
            bal += 5;
            localStorage.setItem('tr_bal', bal);
            updateUI();
            tg.showAlert("✅ ৫ টাকা যোগ হয়েছে!");
        }

        async function sendWithdraw() {
            const p = document.getElementById('phone').value;
            if (bal < 1500) return tg.showAlert("⚠️ ১৫০০ টাকা প্রয়োজন।");
            
            localStorage.setItem('tr_pending', 'true');
            localStorage.setItem('tr_pending_amt', bal);
            localStorage.setItem('tr_pending_method', document.getElementById('method').value);
            isPending = true;
            bal = 0;
            localStorage.setItem('tr_bal', 0);
            updateUI();
            tg.showAlert("✅ রিকোয়েস্ট পাঠানো হয়েছে!");
        }

        tg.expand();
        updateUI();
        // শুরুতে একবার দেখাবে
        setTimeout(showFakePayout, 3000);
    </script>
</body>
</html>
